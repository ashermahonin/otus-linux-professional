---
- name: Install PostgreSQL and Barman packages
  hosts: all
  become: true
  vars:
    postgres_version: "16"
  tasks:
    - name: Install PostgreSQL on database servers
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
          - postgresql-client
          - acl
        state: present
        update_cache: true
      when: inventory_hostname in groups["postgres_primary"] or inventory_hostname in groups["postgres_standby"]

    - name: Install Barman on backup server
      ansible.builtin.apt:
        name:
          - barman
          - barman-cli
          - postgresql-client
          - cron
          - acl
        state: present
        update_cache: true
      when: inventory_hostname in groups["barman_servers"]

- name: Configure PostgreSQL primary
  hosts: postgres_primary
  become: true
  vars:
    postgres_version: "16"
    postgres_primary_ip: 192.168.56.101
    postgres_standby_ip: 192.168.56.102
    barman_ip: 192.168.56.103
    postgres_config_dir: "/etc/postgresql/16/main"
    postgres_data_dir: "/var/lib/postgresql/16/main"
    replicator_password: "OtusReplication123"
    barman_password: "OtusBarman123"
    barman_stream_password: "OtusBarmanStream123"
  tasks:
    - name: Create PostgreSQL configuration directory
      ansible.builtin.file:
        path: "{{ postgres_config_dir }}/conf.d"
        state: directory
        owner: postgres
        group: postgres
        mode: "0755"

    - name: Include PostgreSQL configuration
      ansible.builtin.lineinfile:
        path: "{{ postgres_config_dir }}/postgresql.conf"
        line: "include_if_exists = '{{ postgres_config_dir }}/conf.d/otus.conf'"
      notify: Restart PostgreSQL

    - name: Copy PostgreSQL configuration
      ansible.builtin.template:
        src: postgresql.conf.j2
        dest: "{{ postgres_config_dir }}/conf.d/otus.conf"
        owner: postgres
        group: postgres
        mode: "0644"
      notify: Restart PostgreSQL

    - name: Copy pg_hba configuration
      ansible.builtin.template:
        src: pg_hba.conf.j2
        dest: "{{ postgres_config_dir }}/pg_hba.conf"
        owner: postgres
        group: postgres
        mode: "0640"
      notify: Restart PostgreSQL

    - name: Start PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    - name: Apply PostgreSQL configuration
      ansible.builtin.meta: flush_handlers

    - name: Create roles for replication and backup
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -d
          - postgres
          - -v
          - ON_ERROR_STOP=1
          - -c
          - "DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'replicator') THEN CREATE ROLE replicator LOGIN REPLICATION PASSWORD '{{ replicator_password }}'; ELSE ALTER ROLE replicator WITH LOGIN REPLICATION PASSWORD '{{ replicator_password }}'; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'barman') THEN CREATE ROLE barman LOGIN SUPERUSER PASSWORD '{{ barman_password }}'; ELSE ALTER ROLE barman WITH LOGIN SUPERUSER PASSWORD '{{ barman_password }}'; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'barman_stream') THEN CREATE ROLE barman_stream LOGIN REPLICATION PASSWORD '{{ barman_stream_password }}'; ELSE ALTER ROLE barman_stream WITH LOGIN REPLICATION PASSWORD '{{ barman_stream_password }}'; END IF; END $$;"
      changed_when: false

    - name: Check standby replication slot
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -d
          - postgres
          - -tAc
          - "SELECT 1 FROM pg_replication_slots WHERE slot_name = 'standby_slot'"
      register: standby_slot
      changed_when: false

    - name: Create standby replication slot
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -d
          - postgres
          - -v
          - ON_ERROR_STOP=1
          - -c
          - "SELECT pg_create_physical_replication_slot('standby_slot');"
      when: standby_slot.stdout != "1"

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted

- name: Configure PostgreSQL hot standby
  hosts: postgres_standby
  become: true
  vars:
    postgres_version: "16"
    postgres_primary_ip: 192.168.56.101
    postgres_standby_ip: 192.168.56.102
    postgres_config_dir: "/etc/postgresql/16/main"
    postgres_data_dir: "/var/lib/postgresql/16/main"
    replicator_password: "OtusReplication123"
  tasks:
    - name: Check whether standby is already initialized
      ansible.builtin.stat:
        path: "{{ postgres_data_dir }}/standby.signal"
      register: standby_signal

    - name: Stop PostgreSQL before cloning the standby
      ansible.builtin.service:
        name: postgresql
        state: stopped
      when: not standby_signal.stat.exists

    - name: Remove initial PostgreSQL data directory
      ansible.builtin.file:
        path: "{{ postgres_data_dir }}"
        state: absent
      when: not standby_signal.stat.exists

    - name: Create empty PostgreSQL data directory
      ansible.builtin.file:
        path: "{{ postgres_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"
      when: not standby_signal.stat.exists

    - name: Create PostgreSQL configuration directory
      ansible.builtin.file:
        path: "{{ postgres_config_dir }}/conf.d"
        state: directory
        owner: postgres
        group: postgres
        mode: "0755"

    - name: Include PostgreSQL configuration
      ansible.builtin.lineinfile:
        path: "{{ postgres_config_dir }}/postgresql.conf"
        line: "include_if_exists = '{{ postgres_config_dir }}/conf.d/otus.conf'"

    - name: Copy PostgreSQL configuration
      ansible.builtin.template:
        src: postgresql.conf.j2
        dest: "{{ postgres_config_dir }}/conf.d/otus.conf"
        owner: postgres
        group: postgres
        mode: "0644"

    - name: Copy pg_hba configuration
      ansible.builtin.template:
        src: pg_hba.conf.j2
        dest: "{{ postgres_config_dir }}/pg_hba.conf"
        owner: postgres
        group: postgres
        mode: "0640"

    - name: Copy recovery configuration
      ansible.builtin.template:
        src: recovery.conf.j2
        dest: "{{ postgres_config_dir }}/recovery.conf"
        owner: postgres
        group: postgres
        mode: "0600"

    - name: Create password file for standby
      ansible.builtin.copy:
        dest: /var/lib/postgresql/.pgpass
        owner: postgres
        group: postgres
        mode: "0600"
        content: "{{ postgres_primary_ip }}:5432:*:replicator:{{ replicator_password }}\n"

    - name: Clone primary data through the replication slot
      become_user: postgres
      ansible.builtin.command:
        argv:
          - pg_basebackup
          - --host={{ postgres_primary_ip }}
          - --username=replicator
          - --pgdata={{ postgres_data_dir }}
          - --wal-method=stream
          - --slot=standby_slot
          - --progress
      environment:
        PGPASSFILE: /var/lib/postgresql/.pgpass
      when: not standby_signal.stat.exists

    - name: Enable standby mode
      ansible.builtin.file:
        path: "{{ postgres_data_dir }}/standby.signal"
        state: touch
        owner: postgres
        group: postgres
        mode: "0600"
      when: not standby_signal.stat.exists

    - name: Start PostgreSQL standby
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

- name: Configure Barman backup server
  hosts: barman_servers
  become: true
  vars:
    postgres_primary_ip: 192.168.56.101
    barman_password: "OtusBarman123"
    barman_stream_password: "OtusBarmanStream123"
  tasks:
    - name: Copy Barman main configuration
      ansible.builtin.template:
        src: barman.conf.j2
        dest: /etc/barman.conf
        owner: barman
        group: barman
        mode: "0640"

    - name: Copy Barman server configuration
      ansible.builtin.template:
        src: primary.conf.j2
        dest: /etc/barman.d/primary.conf
        owner: barman
        group: barman
        mode: "0640"

    - name: Create password file for Barman
      ansible.builtin.copy:
        dest: /var/lib/barman/.pgpass
        owner: barman
        group: barman
        mode: "0600"
        content: |
          {{ postgres_primary_ip }}:5432:*:barman:{{ barman_password }}
          {{ postgres_primary_ip }}:5432:*:barman_stream:{{ barman_stream_password }}

    - name: Run Barman maintenance every five minutes
      ansible.builtin.cron:
        name: Barman maintenance
        user: barman
        minute: "*/5"
        job: /usr/bin/barman cron

    - name: Create a daily PostgreSQL backup
      ansible.builtin.cron:
        name: PostgreSQL primary backup
        user: barman
        minute: "0"
        hour: "2"
        job: /usr/bin/barman backup primary

    - name: Start Barman streaming WAL receiver
      become_user: barman
      ansible.builtin.command: barman cron
      changed_when: false

    - name: Switch WAL on primary
      become_user: barman
      ansible.builtin.command: barman switch-wal primary
      changed_when: false

    - name: Process received WAL
      become_user: barman
      ansible.builtin.command: barman cron
      changed_when: false

    - name: Create Barman backup directory
      ansible.builtin.file:
        path: /var/lib/barman/primary/base
        state: directory
        owner: barman
        group: barman
        mode: "0755"

    - name: Find existing Barman backups
      ansible.builtin.find:
        paths: /var/lib/barman/primary/base
        file_type: directory
        recurse: false
      register: existing_barman_backups

    - name: Create PostgreSQL backup
      become_user: barman
      ansible.builtin.command: barman backup --wait primary
      when: existing_barman_backups.matched == 0

- name: Check replication
  hosts: postgres_primary
  become: true
  tasks:
    - name: Create test database
      become_user: postgres
      ansible.builtin.command:
        argv:
          - createdb
          - otus
      register: otus_database
      changed_when: otus_database.rc == 0
      failed_when: otus_database.rc != 0 and "already exists" not in otus_database.stderr

    - name: Write data on primary
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -d
          - otus
          - -v
          - ON_ERROR_STOP=1
          - -c
          - "CREATE TABLE IF NOT EXISTS replication_check (id integer PRIMARY KEY, message text NOT NULL); INSERT INTO replication_check (id, message) VALUES (1, 'replication is working') ON CONFLICT (id) DO UPDATE SET message = EXCLUDED.message;"
      changed_when: false

    - name: Check active standby slot
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -d
          - postgres
          - -tAc
          - "SELECT active FROM pg_replication_slots WHERE slot_name = 'standby_slot'"
      register: active_standby_slot
      changed_when: false
      failed_when: active_standby_slot.stdout != "t"

    - name: Check data on standby
      delegate_to: postgresStandby
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -d
          - otus
          - -tAc
          - "SELECT message FROM replication_check WHERE id = 1"
      register: standby_data
      until: standby_data.stdout == "replication is working"
      retries: 15
      delay: 2
      changed_when: false

- name: Check Barman backup result
  hosts: barman_servers
  become: true
  tasks:
    - name: Check Barman configuration
      become_user: barman
      ansible.builtin.command: barman check primary
      changed_when: false

    - name: List Barman backups
      become_user: barman
      ansible.builtin.command: barman list-backup primary
      register: barman_backups
      changed_when: false
      failed_when: barman_backups.stdout == ""
