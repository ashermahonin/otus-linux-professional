---
- name: Configure backup server
  hosts: backup_servers
  become: true
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name:
          - borgbackup
          - openssh-server
        state: present
        update_cache: true

    - name: Create borg user
      ansible.builtin.user:
        name: borg
        shell: /bin/bash
        create_home: true

    - name: Wait for backup disk
      ansible.builtin.wait_for:
        path: /dev/sdb
        timeout: 60

    - name: Check backup disk filesystem
      ansible.builtin.command: blkid -s TYPE -o value /dev/sdb
      register: backup_disk_fs
      changed_when: false
      failed_when: false

    - name: Format backup disk
      ansible.builtin.command: mkfs.ext4 -F /dev/sdb
      when: backup_disk_fs.stdout != "ext4"

    - name: Get backup disk UUID
      ansible.builtin.command: blkid -s UUID -o value /dev/sdb
      register: backup_disk_uuid
      changed_when: false

    - name: Mount /var/backup
      ansible.builtin.mount:
        path: /var/backup
        src: "UUID={{ backup_disk_uuid.stdout }}"
        fstype: ext4
        opts: defaults,nofail
        state: mounted

    - name: Set backup directory owner
      ansible.builtin.file:
        path: /var/backup
        owner: borg
        group: borg
        mode: "0700"

- name: Prepare client key
  hosts: clients
  become: true
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name:
          - borgbackup
          - openssh-client
        state: present
        update_cache: true

    - name: Create root ssh directory
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create ssh key for borg
      ansible.builtin.command: ssh-keygen -t ed25519 -N '' -f /root/.ssh/borg_ed25519
      args:
        creates: /root/.ssh/borg_ed25519

    - name: Read client public key
      ansible.builtin.slurp:
        src: /root/.ssh/borg_ed25519.pub
      register: client_borg_public_key

- name: Allow client on backup server
  hosts: backup_servers
  become: true
  tasks:
    - name: Create borg ssh directory
      ansible.builtin.file:
        path: /home/borg/.ssh
        state: directory
        owner: borg
        group: borg
        mode: "0700"

    - name: Add client key for borg user
      ansible.builtin.lineinfile:
        path: /home/borg/.ssh/authorized_keys
        line: "{{ hostvars[groups['clients'][0]].client_borg_public_key.content | b64decode | trim }}"
        create: true
        owner: borg
        group: borg
        mode: "0600"

- name: Configure borg backup on client
  hosts: clients
  become: true
  tasks:
    - name: Add backup server to known hosts
      ansible.builtin.shell: "ssh-keygen -R {{ backup_server_ip }} >/dev/null 2>&1 || true; ssh-keyscan -H {{ backup_server_ip }} > /root/.ssh/known_hosts"
      changed_when: true

    - name: Check borg repository
      ansible.builtin.command: borg info "{{ borg_repo }}"
      environment:
        BORG_PASSPHRASE: "{{ borg_passphrase }}"
        BORG_RSH: "ssh -i /root/.ssh/borg_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/root/.ssh/known_hosts -o BatchMode=yes"
      register: borg_repo_info
      changed_when: false
      failed_when: false

    - name: Initialize borg repository
      ansible.builtin.command: borg init --encryption=repokey-blake2 "{{ borg_repo }}"
      environment:
        BORG_PASSPHRASE: "{{ borg_passphrase }}"
        BORG_RSH: "ssh -i /root/.ssh/borg_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/root/.ssh/known_hosts -o BatchMode=yes"
      when: borg_repo_info.rc != 0

    - name: Install backup script
      ansible.builtin.template:
        src: borg-backup.sh.j2
        dest: /usr/local/sbin/borg-backup.sh
        owner: root
        group: root
        mode: "0750"

    - name: Install systemd service
      ansible.builtin.copy:
        src: borg-backup.service
        dest: /etc/systemd/system/borg-backup.service
        owner: root
        group: root
        mode: "0644"

    - name: Install systemd timer
      ansible.builtin.copy:
        src: borg-backup.timer
        dest: /etc/systemd/system/borg-backup.timer
        owner: root
        group: root
        mode: "0644"

    - name: Enable borg timer
      ansible.builtin.systemd:
        name: borg-backup.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Run first backup
      ansible.builtin.systemd:
        name: borg-backup.service
        state: started
