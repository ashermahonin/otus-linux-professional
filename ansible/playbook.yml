---
- name: Deploy dynamic web applications
  hosts: dynamic_web
  become: true
  tasks:
    - name: Install Docker repository dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3-debian
        state: present
        update_cache: true

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker repository key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker and Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start Docker service
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Create application directories
      ansible.builtin.file:
        path: /opt/dynamic-web/{{ item }}
        state: directory
        mode: "0755"
      loop:
        - nginx
        - php
        - flask
        - react

    - name: Write Docker Compose configuration
      ansible.builtin.copy:
        dest: /opt/dynamic-web/compose.yaml
        mode: "0644"
        content: |
          services:
            nginx:
              image: nginx:1.27-alpine
              ports:
                - "8081:8081"
                - "8082:8082"
                - "8083:8083"
              volumes:
                - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
                - ./php:/var/www/php:ro
              depends_on:
                - php
                - flask
                - react

            php:
              image: php:8.3-fpm-alpine
              volumes:
                - ./php:/var/www/php:ro

            flask:
              image: python:3.12-alpine
              working_dir: /app
              command: sh -c "pip install --no-cache-dir Flask && python app.py"
              volumes:
                - ./flask:/app:ro

            react:
              image: node:20-alpine
              working_dir: /app
              command: sh -c "npm install --omit=dev && node app.js"
              volumes:
                - ./react:/app

    - name: Write Nginx configuration
      ansible.builtin.copy:
        dest: /opt/dynamic-web/nginx/default.conf
        mode: "0644"
        content: |
          server {
              listen 8081;
              server_name _;
              root /var/www/php;
              index index.php;

              location / {
                  try_files $uri $uri/ /index.php?$query_string;
              }

              location ~ \.php$ {
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_pass php:9000;
              }
          }

          server {
              listen 8082;
              server_name _;

              location / {
                  proxy_pass http://flask:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }

          server {
              listen 8083;
              server_name _;

              location / {
                  proxy_pass http://react:3000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }

    - name: Write PHP application
      ansible.builtin.copy:
        dest: /opt/dynamic-web/php/index.php
        mode: "0644"
        content: |
          <!doctype html>
          <html lang="ru">
          <head><meta charset="utf-8"><title>PHP-FPM</title></head>
          <body>
            <h1>PHP-FPM</h1>
            <p>Время ответа: <?= htmlspecialchars(date('c')) ?></p>
          </body>
          </html>

    - name: Write Flask application
      ansible.builtin.copy:
        dest: /opt/dynamic-web/flask/app.py
        mode: "0644"
        content: |
          from datetime import datetime, timezone
          from flask import Flask

          app = Flask(__name__)

          @app.get("/")
          def index():
              return (
                  "<!doctype html><html lang='ru'><head><meta charset='utf-8'>"
                  "<title>Flask</title></head><body><h1>Flask</h1>"
                  f"<p>Время ответа: {datetime.now(timezone.utc).isoformat()}</p>"
                  "</body></html>"
              )

          app.run(host="0.0.0.0", port=5000)

    - name: Write React package manifest
      ansible.builtin.copy:
        dest: /opt/dynamic-web/react/package.json
        mode: "0644"
        content: |
          {
            "dependencies": {
              "express": "4.21.2",
              "react": "19.0.0",
              "react-dom": "19.0.0"
            }
          }

    - name: Write React application
      ansible.builtin.copy:
        dest: /opt/dynamic-web/react/app.js
        mode: "0644"
        content: |
          const express = require("express");
          const React = require("react");
          const { renderToStaticMarkup } = require("react-dom/server");

          const app = express();

          app.get("/", (_, response) => {
            const page = React.createElement(
              "main",
              null,
              React.createElement("h1", null, "React"),
              React.createElement(
                "p",
                null,
                "Время ответа: " + new Date().toISOString()
              )
            );

            response.type("html").send(
              "<!doctype html><html lang='ru'><head><meta charset='utf-8'>"
              + "<title>React</title></head><body>"
              + renderToStaticMarkup(page)
              + "</body></html>"
            );
          });

          app.listen(3000, "0.0.0.0");

    - name: Start applications
      ansible.builtin.command: docker compose up -d
      args:
        chdir: /opt/dynamic-web
      changed_when: false

    - name: Check PHP site through Nginx
      ansible.builtin.uri:
        url: http://127.0.0.1:8081
        return_content: true
      register: php_site
      retries: 20
      delay: 2
      until: php_site.status == 200 and "PHP-FPM" in php_site.content

    - name: Check Flask site through Nginx
      ansible.builtin.uri:
        url: http://127.0.0.1:8082
        return_content: true
      register: flask_site
      retries: 20
      delay: 2
      until: flask_site.status == 200 and "Flask" in flask_site.content

    - name: Check React site through Nginx
      ansible.builtin.uri:
        url: http://127.0.0.1:8083
        return_content: true
      register: react_site
      retries: 20
      delay: 2
      until: react_site.status == 200 and "React" in react_site.content
