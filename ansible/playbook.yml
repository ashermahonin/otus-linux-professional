---
- name: Install tools for network checks
  hosts: all
  become: true
  tasks:
    - name: Install ping
      ansible.builtin.apt:
        name: iputils-ping
        state: present

- name: Configure routes without Vagrant NAT
  hosts: network_nodes
  become: true
  vars:
    default_gateways:
      centralRouter: 192.168.255.1
      office1Router: 192.168.0.17
      office2Router: 192.168.0.17
      centralServer: 192.168.0.1
      office1Server: 192.168.2.1
      office2Server: 192.168.1.1
    static_routes:
      centralRouter:
        - network: 192.168.1.0/24
          gateway: 192.168.0.19
        - network: 192.168.2.0/24
          gateway: 192.168.0.18
  tasks:
    - name: Ignore NAT route from Vagrant interface
      ansible.builtin.copy:
        dest: /etc/netplan/99-otus-no-nat-route.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          network:
            version: 2
            ethernets:
              enp0s8:
                dhcp4: true
                dhcp4-overrides:
                  use-routes: false
                  use-dns: false
      register: netplan_config

    - name: Apply Netplan configuration
      ansible.builtin.command: netplan apply
      when: netplan_config.changed
      changed_when: false

    - name: Save default route and static routes
      ansible.builtin.copy:
        dest: /etc/systemd/system/otus-network-routes.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Routes for OTUS network lab
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStartPre=/bin/sleep 5
          ExecStart=/bin/sh -c '/usr/sbin/ip route flush dev eth0 proto dhcp || true'
          ExecStart=/usr/sbin/ip route replace default via {{ default_gateways[inventory_hostname] }}
          {% for route in static_routes.get(inventory_hostname, []) %}
          ExecStart=/usr/sbin/ip route replace {{ route.network }} via {{ route.gateway }}
          {% endfor %}

          [Install]
          WantedBy=multi-user.target

    - name: Watch Vagrant network configuration
      ansible.builtin.copy:
        dest: /etc/systemd/system/otus-network-routes.path
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Reapply routes after Vagrant network setup

          [Path]
          PathChanged=/etc/netplan/50-vagrant.yaml
          Unit=otus-network-routes.service

          [Install]
          WantedBy=multi-user.target

    - name: Enable routes
      ansible.builtin.systemd:
        name: otus-network-routes.service
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Enable route watcher
      ansible.builtin.systemd:
        name: otus-network-routes.path
        enabled: true
        state: started
        daemon_reload: true

    - name: Read default route
      ansible.builtin.command: ip route show default
      register: default_route
      changed_when: false

    - name: Check default route
      ansible.builtin.assert:
        that:
          - default_gateways[inventory_hostname] in default_route.stdout
          - "'10.0.2.2' not in default_route.stdout"

- name: Configure route on internet gateway
  hosts: inetRouter
  become: true
  tasks:
    - name: Save route to office networks
      ansible.builtin.copy:
        dest: /etc/systemd/system/otus-inet-route.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Route to OTUS office networks
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/sbin/ip route replace 192.168.0.0/16 via 192.168.255.2
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target

    - name: Enable route to office networks
      ansible.builtin.systemd:
        name: otus-inet-route.service
        enabled: true
        state: restarted
        daemon_reload: true

- name: Enable packet forwarding
  hosts: routers
  become: true
  tasks:
    - name: Save forwarding setting
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-otus-network.conf
        owner: root
        group: root
        mode: "0644"
        content: "net.ipv4.ip_forward = 1\n"
      register: forwarding_config

    - name: Apply forwarding setting
      ansible.builtin.command: sysctl --system
      when: forwarding_config.changed
      changed_when: false

- name: Configure internet gateway
  hosts: inetRouter
  become: true
  tasks:
    - name: Install iptables
      ansible.builtin.apt:
        name: iptables
        state: present

    - name: Save NAT rule
      ansible.builtin.copy:
        dest: /etc/systemd/system/otus-network-nat.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=NAT for OTUS network lab
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c '/usr/sbin/iptables -t nat -C POSTROUTING -s 192.168.0.0/16 -o {{ ansible_facts["default_ipv4"]["interface"] }} -j MASQUERADE || /usr/sbin/iptables -t nat -A POSTROUTING -s 192.168.0.0/16 -o {{ ansible_facts["default_ipv4"]["interface"] }} -j MASQUERADE'
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target

    - name: Enable NAT rule
      ansible.builtin.systemd:
        name: otus-network-nat.service
        enabled: true
        state: restarted
        daemon_reload: true

- name: Check communication between servers
  hosts: centralServer
  become: true
  tasks:
    - name: Ping office servers from central server
      ansible.builtin.command: ping -c 2 -W 2 {{ item }}
      loop:
        - 192.168.2.2
        - 192.168.1.2
      changed_when: false

- name: Check communication from office servers
  hosts: office1Server
  become: true
  tasks:
    - name: Ping central and second office server
      ansible.builtin.command: ping -c 2 -W 2 {{ item }}
      loop:
        - 192.168.0.2
        - 192.168.1.2
      changed_when: false

- name: Check communication from second office
  hosts: office2Server
  become: true
  tasks:
    - name: Ping central and first office server
      ansible.builtin.command: ping -c 2 -W 2 {{ item }}
      loop:
        - 192.168.0.2
        - 192.168.2.2
      changed_when: false
