---
- name: Install DNS packages
  hosts: all
  become: true
  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - bind9
          - bind9utils
          - dnsutils
        state: present
        update_cache: true

- name: Configure DNS servers
  hosts: dns_servers
  become: true
  vars:
    dns_server_ips:
      ns01: 192.168.50.10
      ns02: 192.168.50.11
  tasks:
    - name: Write main BIND configuration
      ansible.builtin.copy:
        dest: /etc/bind/named.conf
        owner: root
        group: bind
        mode: "0644"
        content: |
          include "/etc/bind/named.conf.options";
          include "/etc/bind/named.conf.local";

    - name: Write BIND options
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.options
        owner: root
        group: bind
        mode: "0644"
        content: |
          options {
              directory "/var/cache/bind";
              listen-on { 127.0.0.1; {{ dns_server_ips[inventory_hostname] }}; };
              listen-on-v6 { none; };
              recursion no;
              allow-query { any; };
              dnssec-validation no;
          };

    - name: Write split DNS configuration
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.local
        owner: root
        group: bind
        mode: "0644"
        content: |
          acl client1 { 192.168.50.15; };
          acl client2 { 192.168.50.16; };

          view "client1" {
              match-clients { client1; };

              zone "dns.lab" {
                  type master;
                  file "/etc/bind/db.dns.lab.client1";
              };

              zone "newdns.lab" {
                  type master;
                  file "/etc/bind/db.newdns.lab";
              };
          };

          view "client2" {
              match-clients { client2; };

              zone "dns.lab" {
                  type master;
                  file "/etc/bind/db.dns.lab.client2";
              };
          };

    - name: Write DNS zones
      ansible.builtin.copy:
        dest: "/etc/bind/{{ item.name }}"
        owner: root
        group: bind
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: db.dns.lab.client1
          content: |
            $TTL 3600
            $ORIGIN dns.lab.
            @ IN SOA ns01.dns.lab. root.dns.lab. (
                2026071901 3600 600 86400 3600
            )
            @ IN NS ns01.dns.lab.
            ns01 IN A 192.168.50.10
            web1 IN A 192.168.50.15

        - name: db.dns.lab.client2
          content: |
            $TTL 3600
            $ORIGIN dns.lab.
            @ IN SOA ns01.dns.lab. root.dns.lab. (
                2026071901 3600 600 86400 3600
            )
            @ IN NS ns01.dns.lab.
            ns01 IN A 192.168.50.10
            web2 IN A 192.168.50.16

        - name: db.newdns.lab
          content: |
            $TTL 3600
            $ORIGIN newdns.lab.
            @ IN SOA ns01.newdns.lab. root.newdns.lab. (
                2026071901 3600 600 86400 3600
            )
            @ IN NS ns01.newdns.lab.
            ns01 IN A 192.168.50.10
            www IN A 192.168.50.15
            www IN A 192.168.50.16

    - name: Check BIND configuration
      ansible.builtin.command: named-checkconf
      changed_when: false

    - name: Check DNS zones
      ansible.builtin.command:
        argv:
          - named-checkzone
          - "{{ item.zone }}"
          - "/etc/bind/{{ item.file }}"
      loop:
        - zone: dns.lab
          file: db.dns.lab.client1
        - zone: dns.lab
          file: db.dns.lab.client2
        - zone: newdns.lab
          file: db.newdns.lab
      changed_when: false

    - name: Enable and restart BIND
      ansible.builtin.service:
        name: bind9
        state: restarted
        enabled: true

- name: Configure DNS clients
  hosts: clients
  become: true
  tasks:
    - name: Create systemd-resolved configuration directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Set DNS servers on clients
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/dns.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Resolve]
          DNS=192.168.50.10 192.168.50.11
          Domains=dns.lab newdns.lab

    - name: Restart systemd-resolved
      ansible.builtin.service:
        name: systemd-resolved
        state: restarted
