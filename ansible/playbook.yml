---
- name: Configure DHCP and PXE server
  hosts: all
  become: true
  vars:
    pxe_address: 192.168.56.20
    pxe_network: 192.168.56.0
    pxe_netmask: 255.255.255.0
    netboot_url: https://releases.ubuntu.com/24.04.4/ubuntu-24.04.4-netboot-amd64.tar.gz
    installer_url: http://releases.ubuntu.com/24.04.4/ubuntu-24.04.4-live-server-amd64.iso
  tasks:
    - name: Install DHCP, TFTP and HTTP services
      ansible.builtin.apt:
        name:
          - apache2
          - iptables
          - isc-dhcp-server
          - tftpd-hpa
        state: present
        update_cache: true

    - name: Create TFTP directory
      ansible.builtin.file:
        path: /srv/tftp
        state: directory
        owner: tftp
        group: tftp
        mode: "0755"

    - name: Download Ubuntu 24 netboot files
      ansible.builtin.get_url:
        url: "{{ netboot_url }}"
        dest: /tmp/ubuntu-24.04.4-netboot-amd64.tar.gz
        mode: "0644"

    - name: Unpack Ubuntu 24 netboot files
      ansible.builtin.unarchive:
        src: /tmp/ubuntu-24.04.4-netboot-amd64.tar.gz
        dest: /srv/tftp
        remote_src: true
        owner: tftp
        group: tftp
        creates: /srv/tftp/amd64/pxelinux.0

    - name: Configure PXE boot menu
      ansible.builtin.copy:
        dest: /srv/tftp/amd64/pxelinux.cfg/default
        owner: tftp
        group: tftp
        mode: "0644"
        content: |
          DEFAULT install
          LABEL install
            KERNEL linux
            INITRD initrd
            APPEND root=/dev/ram0 ramdisk_size=1500000 ip=dhcp iso-url={{ installer_url }} autoinstall ds=nocloud-net;s=http://{{ pxe_address }}/autoinstall/ ---

    - name: Configure DHCP server interface
      ansible.builtin.copy:
        dest: /etc/default/isc-dhcp-server
        owner: root
        group: root
        mode: "0644"
        content: |
          INTERFACESv4="eth1"

    - name: Configure DHCP for PXE client
      ansible.builtin.copy:
        dest: /etc/dhcp/dhcpd.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          default-lease-time 600;
          max-lease-time 7200;
          authoritative;

          subnet {{ pxe_network }} netmask {{ pxe_netmask }} {
            range 192.168.56.100 192.168.56.150;
            option routers {{ pxe_address }};
            option domain-name-servers 1.1.1.1;
            next-server {{ pxe_address }};
            filename "amd64/pxelinux.0";
          }

    - name: Configure TFTP server
      ansible.builtin.copy:
        dest: /etc/default/tftpd-hpa
        owner: root
        group: root
        mode: "0644"
        content: |
          TFTP_USERNAME="tftp"
          TFTP_DIRECTORY="/srv/tftp"
          TFTP_ADDRESS=":69"
          TFTP_OPTIONS="--secure"

    - name: Create directory for autoinstall files
      ansible.builtin.file:
        path: /var/www/html/autoinstall
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Publish user-data file
      ansible.builtin.copy:
        src: files/user-data
        dest: /var/www/html/autoinstall/user-data
        owner: root
        group: root
        mode: "0644"

    - name: Publish meta-data file
      ansible.builtin.copy:
        dest: /var/www/html/autoinstall/meta-data
        owner: root
        group: root
        mode: "0644"
        content: |
          instance-id: pxe-client
          local-hostname: pxe-client

    - name: Enable IPv4 forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-pxe-forwarding.conf
        owner: root
        group: root
        mode: "0644"
        content: "net.ipv4.ip_forward = 1\n"
      register: forwarding_config

    - name: Apply IPv4 forwarding setting
      ansible.builtin.command: sysctl --system
      when: forwarding_config.changed
      changed_when: false

    - name: Save NAT rule for PXE network
      ansible.builtin.copy:
        dest: /etc/systemd/system/pxe-nat.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=NAT for PXE network
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c '/usr/sbin/iptables -t nat -C POSTROUTING -s {{ pxe_network }}/24 -o {{ ansible_facts.default_ipv4.interface }} -j MASQUERADE || /usr/sbin/iptables -t nat -A POSTROUTING -s {{ pxe_network }}/24 -o {{ ansible_facts.default_ipv4.interface }} -j MASQUERADE'
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target

    - name: Enable NAT rule
      ansible.builtin.systemd:
        name: pxe-nat.service
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Start PXE services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: restarted
      loop:
        - apache2
        - isc-dhcp-server
        - tftpd-hpa

    - name: Check user-data availability
      ansible.builtin.uri:
        url: http://127.0.0.1/autoinstall/user-data
        return_content: true
      register: user_data

    - name: Check installation image availability
      ansible.builtin.uri:
        url: "{{ installer_url }}"
        method: HEAD
        status_code: 200

    - name: Check autoinstall configuration
      ansible.builtin.assert:
        that: "'autoinstall:' in user_data.content"
