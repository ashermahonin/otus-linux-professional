---
- name: Configure FreeIPA server
  hosts: ipa_server
  become: true
  vars:
    ipa_server_name: ipa.otus.test
    ipa_server_ip: 192.168.56.10
    ipa_client_name: client.otus.test
    ipa_client_ip: 192.168.56.20
    ipa_domain: otus.test
    ipa_realm: OTUS.TEST
    ipa_dm_password: DirectoryManager123
    ipa_admin_password: Admin12345
  tasks:
    - name: Set FreeIPA server hostname
      ansible.builtin.command: hostnamectl set-hostname {{ ipa_server_name }}
      changed_when: false

    - name: Set local host records
      ansible.builtin.copy:
        dest: /etc/hosts
        owner: root
        group: root
        mode: "0644"
        content: |
          127.0.0.1 localhost localhost.localdomain
          {{ ipa_server_ip }} {{ ipa_server_name }} ipa
          {{ ipa_client_ip }} {{ ipa_client_name }} client

    - name: Install FreeIPA server packages
      ansible.builtin.dnf:
        name:
          - ipa-server
          - ipa-server-dns
        state: present

    - name: Start firewall service
      ansible.builtin.service:
        name: firewalld
        enabled: true
        state: started

    - name: Install FreeIPA server
      ansible.builtin.command:
        argv:
          - ipa-server-install
          - --unattended
          - --hostname={{ ipa_server_name }}
          - --domain={{ ipa_domain }}
          - --realm={{ ipa_realm }}
          - --ds-password={{ ipa_dm_password }}
          - --admin-password={{ ipa_admin_password }}
          - --setup-dns
          - --no-forwarders
          - --no-ntp
      args:
        creates: /etc/ipa/default.conf
      no_log: true

    - name: Allow FreeIPA services in firewall
      ansible.builtin.command: firewall-cmd --permanent --add-service={{ item }}
      loop:
        - freeipa-ldap
        - dns
      register: firewall_rule
      changed_when: "'success' in firewall_rule.stdout"

    - name: Reload firewall rules
      ansible.builtin.command: firewall-cmd --reload
      changed_when: false

    - name: Get Kerberos ticket for FreeIPA admin
      ansible.builtin.shell: >-
        printf '%s\n' '{{ ipa_admin_password }}' |
        kinit admin
      changed_when: false
      no_log: true

    - name: Add test user to FreeIPA
      ansible.builtin.command:
        argv:
          - ipa
          - user-add
          - otususer
          - --first=Otus
          - --last=User
          - --email=otususer@{{ ipa_domain }}
      register: ipa_user
      changed_when: ipa_user.rc == 0
      failed_when: ipa_user.rc != 0 and "already exists" not in ipa_user.stderr

- name: Configure FreeIPA client
  hosts: ipa_clients
  become: true
  vars:
    ipa_server_name: ipa.otus.test
    ipa_server_ip: 192.168.56.10
    ipa_client_name: client.otus.test
    ipa_client_ip: 192.168.56.20
    ipa_domain: otus.test
    ipa_realm: OTUS.TEST
    ipa_admin_password: Admin12345
  tasks:
    - name: Set FreeIPA client hostname
      ansible.builtin.command: hostnamectl set-hostname {{ ipa_client_name }}
      changed_when: false

    - name: Set local host records
      ansible.builtin.copy:
        dest: /etc/hosts
        owner: root
        group: root
        mode: "0644"
        content: |
          127.0.0.1 localhost localhost.localdomain
          {{ ipa_server_ip }} {{ ipa_server_name }} ipa
          {{ ipa_client_ip }} {{ ipa_client_name }} client

    - name: Install FreeIPA client package
      ansible.builtin.dnf:
        name: ipa-client
        state: present

    - name: Set FreeIPA DNS server for client
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/90-ipa-dns.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [main]
          dns=none

    - name: Write client resolver configuration
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          search {{ ipa_domain }}
          nameserver {{ ipa_server_ip }}

    - name: Join FreeIPA domain
      ansible.builtin.command:
        argv:
          - ipa-client-install
          - --unattended
          - --domain={{ ipa_domain }}
          - --realm={{ ipa_realm }}
          - --server={{ ipa_server_name }}
          - --principal=admin
          - --password={{ ipa_admin_password }}
          - --mkhomedir
          - --no-ntp
          - --force-join
      args:
        creates: /etc/ipa/default.conf
      no_log: true

    - name: Check FreeIPA user on client
      ansible.builtin.command: getent passwd otususer
      changed_when: false
