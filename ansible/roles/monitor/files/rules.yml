groups:
  - name: availability
    rules:
      - alert: InstanceDown
        expr: up{job="node"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node exporter is unavailable on {{ $labels.instance_name }}"
      - alert: WebEndpointDown
        expr: probe_success{job="blackbox_https"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "HTTPS endpoint is unavailable"
